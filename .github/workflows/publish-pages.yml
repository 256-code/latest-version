name: Publish Pages Preview

# push 到 main 后构建 apps/web，并把静态产物发布到 gh-pages 分支
# 预览地址: https://256-code.github.io/latest-version/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish build to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch gh-pages https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git /tmp/pages-publish
          cd /tmp/pages-publish
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R $GITHUB_WORKSPACE/apps/web/dist/. .
          touch .nojekyll
          cp index.html 404.html
          git config user.name github-actions-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo no content changes, publish skipped
          else
            git commit --quiet -m ci:publish-$GITHUB_SHA
            git push --quiet origin gh-pages
          fi
